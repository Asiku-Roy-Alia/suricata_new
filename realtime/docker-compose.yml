# =============================================================================
# Hybrid IDS Real-Time Defence Demo Stack
#
# Services:
#   1. pcap-generator    Continuously regenerates a 15,000-packet PCAP file
#                        with realistic CIC-IDS-2017-style traffic mix.
#   2. suricata          Captures from offline PCAP in a wrapper loop.
#   3. pcap-loader       Cycles fresh PCAPs into Suricata's watch directory.
#   4. realtime-bridge   Tails EVE JSON, runs hybrid ML model, pushes to ES.
#   5. elasticsearch     Stores decision documents.
#   6. kibana            Interactive Elastic dashboard.
#   7. kibana-setup      One-shot: creates ES index template, imports dashboard.
#   8. node-dashboard    React dashboard with built-in traffic simulation.
#
# Ports exposed to the host:
#   - 5601  Kibana
#   - 9200  Elasticsearch
#   - 3000  React Node dashboard
#
# Usage:
#   docker compose up -d
#   docker compose logs -f realtime-bridge
#   open http://localhost:5601/app/dashboards
#   open http://localhost:3000
#   docker compose down
#   docker compose down -v
# =============================================================================

services:

  # ---------------------------------------------------------------
  # 1. Continuous PCAP generator
  # ---------------------------------------------------------------
  pcap-generator:
    image: python:3.11-slim
    container_name: hybrid-pcap-gen
    restart: unless-stopped
    working_dir: /work
    volumes:
      - ./generator/continuous_generator.py:/work/continuous_generator.py:ro
      - pcaps:/pcaps
    command: >
      python /work/continuous_generator.py
      --out /pcaps/live.pcap
      --packets 15000
      --interval 60

  # ---------------------------------------------------------------
  # 2. Suricata: looped offline-pcap analysis
  # ---------------------------------------------------------------
  suricata:
    image: jasonish/suricata:7.0
    container_name: hybrid-suricata
    restart: unless-stopped
    depends_on:
      - pcap-generator
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules:/etc/suricata/rules:ro
      - pcap-watch:/pcap-watch
      - suricata-logs:/var/log/suricata
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "[suricata] starting wrapper loop"
        MASTER=/var/log/suricata/eve.json
        > "$$MASTER"
        while true; do
          PCAP=$$(ls -tr /pcap-watch/feed_*.pcap 2>/dev/null | head -1)
          if [ -z "$$PCAP" ]; then
            sleep 2
            continue
          fi
          echo "[suricata] processing $$PCAP"
          mkdir -p /tmp/sr-iter
          rm -f /tmp/sr-iter/*.json
          suricata -c /etc/suricata/suricata.yaml \
            -r "$$PCAP" \
            -l /tmp/sr-iter \
            --runmode=autofp \
            -k none > /tmp/sr-iter.stdout 2>&1 || true
          if [ -f /tmp/sr-iter/eve.json ]; then
            cat /tmp/sr-iter/eve.json >> "$$MASTER"
            echo "[suricata] appended $$(wc -l < /tmp/sr-iter/eve.json) events to master eve.json"
          fi
          rm -f "$$PCAP"
          echo "[suricata] done with $$PCAP, master eve.json now has $$(wc -l < $$MASTER) events"
        done

  # ---------------------------------------------------------------
  # 3. PCAP loader
  # ---------------------------------------------------------------
  pcap-loader:
    image: alpine:3.19
    container_name: hybrid-pcap-loader
    restart: unless-stopped
    depends_on:
      - pcap-generator
      - suricata
    volumes:
      - pcaps:/pcaps:ro
      - pcap-watch:/pcap-watch
    command: |
      sh -c '
        echo "[loader] waiting for first /pcaps/live.pcap";
        while [ ! -f /pcaps/live.pcap ]; do sleep 2; done;
        i=0;
        while true; do
          i=$$((i + 1));
          if [ -f /pcaps/live.pcap ]; then
            cp /pcaps/live.pcap /pcap-watch/.tmp_$$$$.pcap;
            mv /pcap-watch/.tmp_$$$$.pcap /pcap-watch/feed_$$i.pcap;
            echo "[loader] dropped feed_$$i.pcap into watch dir";
          fi;
          sleep 20;
        done
      '

  # ---------------------------------------------------------------
  # 4. Real-time ML bridge
  # ---------------------------------------------------------------
  realtime-bridge:
    image: python:3.11-slim
    container_name: hybrid-bridge
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    working_dir: /work
    environment:
      ES_URL: "http://elasticsearch:9200"
      ES_INDEX: "hybrid-ids-decisions"
      HYBRID_IDS_ROOT: "/hybrid-ids"
    volumes:
      - ./bridge/realtime_bridge.py:/work/realtime_bridge.py:ro
      - ../hybrid-ids:/hybrid-ids:ro
      - suricata-logs:/var/log/suricata:ro
      - bridge-data:/data
    command: |
      sh -c '
        set -e
        echo "[bridge] Installing Python dependencies..."
        pip install --quiet --no-cache-dir joblib numpy pandas scikit-learn imbalanced-learn requests
        echo "[bridge] Starting realtime_bridge.py..."
        exec python /work/realtime_bridge.py \
          --eve /var/log/suricata/eve.json \
          --pipeline /hybrid-ids/artifacts/feature_pipeline.joblib \
          --model /hybrid-ids/artifacts/hybrid.joblib \
          --csv-tail /data/decisions_tail.csv
      '

  # ---------------------------------------------------------------
  # 5. Elasticsearch
  # ---------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: hybrid-elasticsearch
    restart: unless-stopped
    environment:
      - "discovery.type=single-node"
      - "xpack.security.enabled=false"
      - "xpack.security.enrollment.enabled=false"
      - "bootstrap.memory_lock=false"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    mem_limit: 1400m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------
  # 6. Kibana
  # ---------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.4
    container_name: hybrid-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      SERVER_PUBLICBASEURL: "http://localhost:5601"
      NODE_OPTIONS: "--max-old-space-size=384"
    mem_limit: 900m
    ports:
      - "127.0.0.1:5601:5601"

  # ---------------------------------------------------------------
  # 7. Kibana setup: creates ES index template, imports dashboard
  # ---------------------------------------------------------------
  kibana-setup:
    image: alpine/curl:8.5.0
    container_name: hybrid-kibana-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started
    volumes:
      - ./kibana:/dashboard:ro
    environment:
      ES_URL: "http://elasticsearch:9200"
      KIBANA_URL: "http://kibana:5601"
    entrypoint:
      - sh
      - /dashboard/setup.sh
    restart: "no"

  # ---------------------------------------------------------------
  # 8. React Node dashboard (built-in simulation, no ES needed)
  # ---------------------------------------------------------------
  node-dashboard:
    build:
      context: ./node_dashboard
      dockerfile: Dockerfile
    container_name: hybrid-node-dashboard
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
    ports:
      - "3000:3000"

# ---------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------
volumes:
  pcaps:
  pcap-watch:
  suricata-logs:
  bridge-data:
  es-data:
